<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube Audio Caster</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#fff; --ink:#16171a; --muted:#6b7076; --line:#e3e5e8;
  --accent:#2f6df6; --ok:#0f9d58; --warn:#d93025; --chip:#eef1f5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f1113; --panel:#17191d; --ink:#e9eaec; --muted:#9aa0a6; --line:#2a2d33;
  --accent:#6f9bff; --ok:#4ade80; --warn:#ff7b72; --chip:#22252b;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:19px;margin:0 0 2px;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],select{
  background:var(--bg);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit}
input[type=text]{flex:1;min-width:260px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;
  padding:10px 16px;font-size:14px;font-weight:560;cursor:pointer;font-family:inherit}
button.ghost{background:var(--chip);color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
#playerwrap{width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
#player,#playerwrap iframe{width:100%;height:100%;border:0;display:block}
.hide{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:14px}
.stat{background:var(--chip);border-radius:9px;padding:10px 12px}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:16px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.buf{background:#e8a33d} .dot.err{background:var(--warn)}
.bar{position:relative;height:18px;display:flex;align-items:center;margin:8px 0 2px;
  cursor:pointer;touch-action:none;user-select:none}
.bar .track{position:relative;width:100%;height:5px;background:var(--chip);border-radius:99px}
.bar .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:99px}
.bar .thumb{position:absolute;top:50%;left:0;width:12px;height:12px;margin:-6px 0 0 -6px;
  border-radius:50%;background:var(--accent);opacity:0;transition:opacity .12s}
.bar:hover .thumb,.bar.scrubbing .thumb{opacity:1}
.bar .bubble{position:absolute;bottom:22px;left:0;transform:translateX(-50%);white-space:nowrap;
  background:var(--ink);color:var(--panel);font-size:11px;padding:2px 6px;border-radius:5px;
  opacity:0;pointer-events:none;font-variant-numeric:tabular-nums;transition:opacity .12s}
.bar:hover .bubble,.bar.scrubbing .bubble{opacity:1}
.bar.disabled{cursor:default}
.bar.disabled .thumb,.bar.disabled .bubble{display:none}
.time{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-top:10px}
.msg.err{background:rgba(217,48,37,.12);color:var(--warn)}
.msg.ok{background:rgba(15,157,88,.12);color:var(--ok)}
.meta{font-size:12.5px;color:var(--muted);margin-top:10px;word-break:break-word}
label.sm{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.aud{font-size:11px;background:var(--chip);border-radius:5px;padding:1px 6px;color:var(--muted)}
#plitems{margin-top:12px;max-height:340px;overflow-y:auto;border-radius:9px}
#plitems:empty{display:none}
.pli{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer}
.pli:hover{background:var(--chip)}
.pli.now{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.pli.now .pli-t{color:var(--accent);font-weight:600}
.pli.dragover{outline:2px dashed var(--accent);outline-offset:-2px}
.pli-n{width:22px;text-align:right;font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;flex:none}
.pli-thumb{width:56px;height:32px;object-fit:cover;border-radius:4px;background:var(--chip);flex:none}
.pli-t{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pli-d{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.pli-b{background:none;color:var(--muted);border:0;padding:3px 6px;font-size:13px;
  cursor:pointer;border-radius:5px;flex:none;opacity:0}
.pli:hover .pli-b{opacity:1}
.pli-b:hover{background:var(--bg);color:var(--ink)}
.pgrid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:860px){.pgrid{grid-template-columns:minmax(0,1fr) 280px}}
body.noqueue .pside{display:none}
@media(min-width:860px){body.noqueue .pgrid{grid-template-columns:minmax(0,1fr)}}
.pside{display:flex;flex-direction:column;min-width:0;border-top:1px solid var(--line);padding-top:14px}
@media(min-width:860px){.pside{border-top:0;border-left:1px solid var(--line);padding:0 0 0 16px}}
.qhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;
  font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
#qmeta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
#qitems{display:flex;flex-direction:column;gap:1px;overflow-y:auto;max-height:360px}
#qitems:empty{display:none}
.qi{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:12.5px}
.qi:hover{background:var(--chip)}
.qi.now{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.qi.now .qi-t{color:var(--accent);font-weight:600}
.qi-n{width:16px;flex:none;text-align:right;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.qi-th{width:44px;height:25px;flex:none;object-fit:cover;border-radius:3px;background:var(--chip)}
.qi-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi-d{flex:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
#vidload{width:100%;aspect-ratio:16/9;border-radius:10px;background:#000;color:#9aa0a6;
  display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px}
/* an id selector beats .hide, so hiding has to be stated at the same weight */
#vidload.hide{display:none}
#playerwrap.hide{display:none}
.spin{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.18);border-top-color:#fff;
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
button.ic{display:inline-flex;align-items:center;justify-content:center;padding:9px 11px;position:relative}
button.ic svg{width:16px;height:16px;display:block}
button:disabled{opacity:.32;cursor:default}
#repone{display:none;position:absolute;right:4px;bottom:3px;font-size:9px;font-weight:700;line-height:1}
#repeat.one #repone{display:block}
#transmsg .msg{margin-top:8px;margin-bottom:0}
.tog{background:var(--chip);color:var(--muted)}
.tog.on{background:var(--accent);color:#fff}
#linkrow{display:none;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
#expand{margin-left:auto}
#exitexpand{display:none;position:fixed;top:12px;right:14px;z-index:70}
body.theater{overflow:hidden}                 /* the scrollbar was eating the right edge */
body.theater .wrap{padding:0;max-width:none;height:100vh;overflow:hidden}
body.theater .card:not(#playercard){display:none}
body.theater #playercard{position:fixed;inset:0;margin:0;padding:0;border:0;border-radius:0;
  background:#000;z-index:40;overflow:hidden}
body.theater .pgrid{display:block}
body.theater .pside{display:none}
body.theater .pmain>*:not(#playerwrap){display:none}
body.theater #playerwrap{position:absolute;inset:0;width:100%;height:100%;
  aspect-ratio:auto;border-radius:0}
body.theater #playerwrap iframe{width:100%;height:100%}
body.theater #exitexpand{display:block;opacity:.25;transition:opacity .15s}
body.theater #exitexpand:hover{opacity:1}
#playerwrap:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0;background:#000}
#playerwrap:fullscreen iframe{width:100%;height:100%}
#ytlink{flex:1;min-width:200px;font-size:12.5px;color:var(--accent);text-decoration:none;
  background:var(--chip);border-radius:7px;padding:7px 10px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
#ytlink:hover{text-decoration:underline}
button.mini{padding:7px 12px;font-size:12.5px}
button.mini.done{background:var(--ok)}
</style>
</head>
<body>
<button class="ghost mini" id="exitexpand" title="Exit theater mode (Esc)">✕ Exit</button>
<div class="wrap">
  <h1>YouTube Audio Caster</h1>
  <div class="sub">Native buffered audio to a Cast speaker &middot; video stays local &amp; synced</div>

  <div class="card">
    <div class="row">
      <input type="text" id="url" placeholder="Paste a YouTube link…"
             value="">
      <select id="device"></select>
      <button id="go">Cast</button>
      <button class="ghost" id="queueadd" title="Append to what is playing instead of replacing it">＋ Queue</button>
      <button class="ghost" id="rescan" title="Re-scan for devices" aria-label="Re-scan for devices"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg></button>
    </div>
    <div id="msg"></div>
  </div>

  <div class="card" id="playercard">
    <div class="pgrid">
      <div class="pmain">
        <div id="playerwrap" class="hide"><div id="player"></div></div>
        <div id="vidload" class="hide"><div class="spin"></div><span>loading track…</span></div>
        <div id="noplayer" class="meta">Video appears here once you cast. Audio goes to the speaker;
          this player is muted and follows the speaker's position.</div>

        <div class="bar disabled" id="bar" title="click or drag to seek">
          <div class="track"><div class="fill" id="prog"></div><div class="thumb" id="thumb"></div></div>
          <div class="bubble" id="bubble">0:00</div>
        </div>
        <div class="time"><span id="tcur">0:00</span><span id="tdur">0:00</span></div>

        <div class="row" style="margin-top:12px">
          <button class="ghost ic" id="prev" title="Previous track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
          <button class="ghost" id="play">▶︎ Play</button>
          <button class="ghost" id="pause">❚❚ Pause</button>
          <button class="ghost ic" id="next" title="Next track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
          <button class="ghost" id="stop">■ Stop</button>
          <button class="ghost ic tog" id="shuffle" title="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg></button>
          <button class="ghost ic tog" id="repeat" title="Repeat: off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><b id="repone">1</b></button>
          <button class="ghost" id="refresh" title="Re-issue an expired CDN url and resume">↻ Refresh stream</button>
          <label class="sm" style="margin-left:auto">vol
            <input type="range" id="vol" min="0" max="100" value="80" style="width:110px">
          </label>
          <label class="sm"><input type="checkbox" id="showvid" checked> show video</label>
          <button class="ghost mini" id="expand" title="Fill the window (Esc to exit)">⤢ Theater</button>
          <button class="ghost mini" id="fullscreen" title="True fullscreen (Esc to exit)">⛶ Fullscreen</button>
        </div>
        <div id="transmsg"></div>

        <div class="grid">
          <div class="stat"><div class="k">state</div><div class="v"><span class="dot" id="dot"></span><span id="state">idle</span></div></div>
          <div class="stat"><div class="k">rebuffers</div><div class="v" id="rebuf">0</div></div>
          <div class="stat"><div class="k">receiver</div><div class="v" id="recv" style="font-size:13px">—</div></div>
          <div class="stat"><div class="k">audio</div><div class="v" id="codec" style="font-size:13px">—</div></div>
        </div>
        <div class="meta" id="title"></div>
        <div id="linkrow">
          <a id="ytlink" href="#" target="_blank" rel="noreferrer" title="open in your browser"></a>
          <button class="ghost mini" id="copylink">Copy</button>
          <label class="sm"><input type="checkbox" id="attime"> at current time</label>
        </div>
      </div>

      <aside class="pside" id="queueside">
        <div class="qhead"><span>Up next</span><span id="qmeta"></span></div>
        <div id="qitems"></div>
      </aside>
    </div>
  </div>

  <div class="card">
    <div class="row" id="plnormal">
      <select id="plsel" style="min-width:190px"></select>
      <button class="ghost mini" id="plnew">+ New</button>
      <button class="ghost mini" id="plrename">Rename</button>
      <button class="ghost mini" id="pldel">Delete</button>
      <span class="meta" id="plcount" style="margin-left:auto"></span>
    </div>
    <div class="row" id="pledit" style="display:none">
      <input type="text" id="plname" placeholder="Playlist name" maxlength="80">
      <button class="mini" id="plsave">Save</button>
      <button class="ghost mini" id="plcancel">Cancel</button>
    </div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="pladd" placeholder="Paste a video or playlist link to add…">
      <button class="ghost mini" id="pladdbtn">Add</button>
      <button class="mini" id="plplay">▶ Play all</button>
      <button class="ghost mini" id="plqueue" title="Append this playlist to the live queue">＋ Queue all</button>
    </div>
    <div id="plmsg"></div>
    <div id="plitems"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let YT_PLAYER=null, YT_READY=false, CUR_VID=null, SYNCING=false, PENDING_VID=null;

/* send diagnostics to the server log so problems are visible without a debugger */
function clog(msg){ try{ fetch('/api/clientlog',{method:'POST',
  headers:{'Content-Type':'application/json'},body:JSON.stringify({msg})}); }catch(e){} }
window.addEventListener('error', e => clog('js error: '+e.message));

/* The IFrame API is loaded programmatically and POLLED for readiness. Relying on
   the onYouTubeIframeAPIReady callback alone is fragile: if the script is served
   from cache or fails to load, the callback may never fire and the player would
   silently never mount. */
function loadYTApi(){
  if(window.YT && window.YT.Player){ YT_READY=true; return; }
  if(!document.getElementById('ytapi')){
    const t=document.createElement('script');
    t.id='ytapi'; t.src='https://www.youtube.com/iframe_api';
    t.onerror=()=>clog('iframe_api FAILED to load');
    document.head.appendChild(t);
  }
}
window.onYouTubeIframeAPIReady=()=>{ YT_READY=true; clog('YT api ready (callback)');
  if(PENDING_VID){const v=PENDING_VID; PENDING_VID=null; mountVideo(v);} };

let ytWaited=0;
setInterval(()=>{
  if(YT_READY) return;
  if(window.YT && window.YT.Player){ YT_READY=true; clog('YT api ready (poll)');
    if(PENDING_VID){const v=PENDING_VID; PENDING_VID=null; mountVideo(v);} return; }
  ytWaited+=500;
  if(ytWaited===5000) clog('YT api still not ready after 5s - retrying load');
  if(ytWaited%5000===0){ const old=document.getElementById('ytapi'); if(old) old.remove(); loadYTApi(); }
}, 500);
loadYTApi();

function fmt(s){s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),
  m=Math.floor(s%3600/60),x=s%60;
  return h? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`
          : `${m}:${String(x).padStart(2,'0')}`;}
function msg(t,cls){$('msg').innerHTML = t? `<div class="msg ${cls||''}">${t}</div>`:'';}

const tmsg=(t,c)=>{ $('transmsg').innerHTML = t? `<div class="msg ${c||''}">${t}</div>`:''; };
let WAITVID=null;                       // video we are waiting for the speaker to reach
function showLoading(on){
  if(on){ $('vidload').classList.remove('hide'); $('playerwrap').classList.add('hide');
          $('noplayer').classList.add('hide'); }
  else  { $('vidload').classList.add('hide'); }
}

function clearVideo(reason){
  WAITVID=null; showLoading(false);
  if(CUR_VID){
    CUR_VID=null;
    try{ if(YT_PLAYER&&YT_PLAYER.stopVideo) YT_PLAYER.stopVideo(); }catch(e){}
  }
  $('playerwrap').classList.add('hide');
  $('noplayer').classList.remove('hide');
  $('noplayer').textContent = reason;
  updateLink(null,0);
  $('title').textContent='';
  DUR=0; paintBar(0); $('tcur').textContent='0:00'; $('tdur').textContent='0:00';
  $('state').textContent='idle'; $('dot').className='dot';
  $('recv').textContent='—'; $('codec').textContent='—';
}

/* Nothing ever un-mounted the player, so switching to an idle speaker left the
   previous device's video happily playing. */
function clearVideo(reason){
  WAITVID=null; showLoading(false);
  if(CUR_VID){ CUR_VID=null;
    try{ if(YT_PLAYER&&YT_PLAYER.stopVideo) YT_PLAYER.stopVideo(); }catch(e){} }
  $('playerwrap').classList.add('hide');
  $('noplayer').classList.remove('hide');
  $('noplayer').textContent=reason;
  updateLink(null,0);
  $('title').textContent=''; DUR=0; paintBar(0);
  $('tcur').textContent='0:00'; $('tdur').textContent='0:00';
  $('state').textContent='idle'; $('dot').className='dot';
  $('recv').textContent='—'; $('codec').textContent='—';
}

function mountVideo(vid){
  if(!vid) return;
  if(!YT_READY){ PENDING_VID=vid; clog('mount deferred, api not ready: '+vid); return; }
  if(vid===CUR_VID && YT_PLAYER) return;
  CUR_VID=vid;
  showLoading(false);
  $('playerwrap').classList.remove('hide'); $('noplayer').classList.add('hide');
  clog('mounting '+vid);
  try{
    if(YT_PLAYER && YT_PLAYER.loadVideoById){ YT_PLAYER.loadVideoById(vid); YT_PLAYER.mute(); return; }
    YT_PLAYER=new YT.Player('player',{videoId:vid,
      playerVars:{autoplay:1,controls:0,mute:1,rel:0,modestbranding:1,playsinline:1,
                  disablekb:1,iv_load_policy:3},
      events:{onReady:e=>{e.target.mute();e.target.playVideo();clog('player ready');},
              onError:e=>clog('player error code '+e.data)}});
  }catch(e){ clog('mount threw: '+e.message); CUR_VID=null; }
}

async function api(p,o){const r=await fetch(p,o);let j={};try{j=await r.json()}catch(e){}
  if(!r.ok) throw new Error(j.error||('HTTP '+r.status)); return j;}

const deviceOptions = ds => ds.map(d=>{
  const kind = d.is_group ? 'group' : (d.audio_only ? 'speaker' : 'video');
  const busy = d.busy ? ' ▸ ' + (d.status_text || 'playing').slice(0,28) : '';
  return `<option value="${esc(d.name)}">${esc(d.name)} — ${kind}${esc(busy)}</option>`;
}).join('');

/* The window is hidden rather than destroyed when toggled from the tray, so the
   page can live for hours without reloading. Re-sync the device list on a timer
   or a speaker that answers mDNS late never shows up at all. */
async function syncDevices(){
  try{
    const j=await api('/api/devices');
    const html=deviceOptions(j.devices);
    if(html && html!==$('device').innerHTML){
      const keep=$('device').value;
      $('device').innerHTML=html;
      if(keep && j.devices.some(d=>d.name===keep)) $('device').value=keep;
      else if(j.connected) $('device').value=j.connected;
      clog('device list updated ('+j.devices.length+')');
    }
  }catch(e){}
}
let devSyncs=0;
setInterval(()=>{ devSyncs++; syncDevices(); }, 20000);
// the first minute is when a late-answering speaker is most likely to appear
const earlySync=setInterval(()=>{ if(devSyncs>0||performance.now()>60000){clearInterval(earlySync);return;} syncDevices(); }, 5000);

async function loadDevices(refresh){
  $('device').innerHTML='<option>scanning…</option>';
  try{
    const j=await api('/api/devices'+(refresh?'?refresh=1':''));
    $('device').innerHTML = deviceOptions(j.devices) || '<option value="">no speakers found</option>';
    if(j.error){
      msg(`<b>${esc(j.error)}</b><br>${esc(j.hint||'')}`,'err');
      $('noplayer').textContent='No speakers found yet.';
      return;
    }
    if(!j.devices.length){ await explainNoSpeakers(); return; }
    /* Attach to whatever is actually playing rather than to a remembered choice.
       mDNS reports which speakers are busy, so this needs nothing stored. */
    const pick = j.connected || j.active;
    const have = pick && [...$('device').options].some(o=>o.value===pick);
    if(have){ $('device').value=pick; attach(); msg(''); }
    else if(j.active_count>1){
      msg('more than one speaker is playing — pick the one you want','ok');
    }
    else { msg('');
           $('noplayer').textContent='Pick a speaker above, then cast a link or play a playlist.'; }
  }catch(e){ $('device').innerHTML='<option value="">scan failed</option>'; msg(e.message,'err'); }
}

/* "No speakers found" is useless on its own. Show what was actually tried, so a
   report comes with facts rather than a symptom. */
async function explainNoSpeakers(){
  let d=null;
  try{ d=await api('/api/diagnostics'); }catch(e){}
  const rows = d ? (d.discovery.interfaces||[]).map(i=>
    `${esc(i.label)} — ${i.ok?'listening':'failed: '+esc(i.error||'')}`).join('<br>') : '';
  msg(`<b>No speakers found on this network.</b><br>
    Cast devices are found over mDNS (UDP port 5353). Things worth checking:<br>
    • this computer is on the <b>same network</b> as the speakers, not a guest network or VPN<br>
    • the app is allowed through the firewall for <b>both private and public</b> networks<br>
    • the speakers are powered on<br>
    ${rows?`<br><span style="opacity:.75">Searching on:<br>${rows}</span>`:''}
    ${d?`<br><span style="opacity:.75">${esc(d.platform)} · ${(d.interfaces||[]).length} network interface(s)</span>`:''}
    <br><br>Press ⟳ to search again.`,'err');
  $('noplayer').textContent='No speakers found. See the message above.';
}

async function attach(){
  const dev=$('device').value; if(!dev) return;
  try{
    const j=await api('/api/attach',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({device:dev})});
    const vid = j.media && j.media.video_id;
    clog('attach adopted='+j.adopted+' video_id='+vid);
    if(vid){                       // identified: show it, whoever started it
      msg('attached to the session playing on '+dev,'ok');
      mountVideo(vid);
    } else if(j.adopted){          // adopted but not yet identified - tick() may still mount
      msg('attached to the session playing on '+dev,'ok');
      $('noplayer').textContent='Working out what is playing…';
    } else msg('');
  }catch(e){ msg(e.message,'err'); }
}

/* Cast exposes a native seek: the speaker re-buffers from the CDN over range
   requests. The only trick is not letting status polling snap the bar backwards
   before the receiver reports the new position. */
let DUR=0, scrubbing=false, seekLock=0, seekTarget=null;
const bar=()=>$('bar');
function pctAt(e){ const r=bar().getBoundingClientRect();
  return Math.max(0, Math.min(1, (e.clientX-r.left)/r.width)); }
function paintBar(pct){
  const s=(pct*100).toFixed(2)+'%';
  $('prog').style.width=s; $('thumb').style.left=s; $('bubble').style.left=s;
}
function showBubble(pct){ $('bubble').textContent=fmt(pct*DUR); $('bubble').style.left=(pct*100)+'%'; }

bar().addEventListener('pointermove', e=>{
  if(!DUR) return;
  const p=pctAt(e); showBubble(p);
  if(scrubbing){ paintBar(p); $('tcur').textContent=fmt(p*DUR); }
});
bar().addEventListener('pointerdown', e=>{
  if(!DUR) return;
  scrubbing=true; bar().classList.add('scrubbing'); bar().setPointerCapture(e.pointerId);
  const p=pctAt(e); paintBar(p); showBubble(p); $('tcur').textContent=fmt(p*DUR);
});
bar().addEventListener('pointerup', async e=>{
  if(!scrubbing) return;
  scrubbing=false; bar().classList.remove('scrubbing');
  try{ bar().releasePointerCapture(e.pointerId); }catch(_){}
  await doSeek(pctAt(e)*DUR);
});

async function doSeek(t){
  if(!DUR) return;
  t=Math.max(0,Math.min(DUR-1,t));
  seekTarget=t; seekLock=Date.now()+6000;      // hold the UI at the target
  paintBar(t/DUR); $('tcur').textContent=fmt(t);
  if(YT_PLAYER&&YT_PLAYER.seekTo){ SYNCING=true; YT_PLAYER.seekTo(t,true);
    setTimeout(()=>SYNCING=false,1500); }
  try{
    await api('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'seek',value:t})});
    clog('seek -> '+Math.round(t)+'s');
  }catch(e){ msg('seek failed: '+e.message,'err'); seekLock=0; seekTarget=null; }
}

async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){
    try{                                   // fallback if the async API is unavailable
      const ta=document.createElement('textarea');
      ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      const ok=document.execCommand('copy'); ta.remove(); return ok;
    }catch(e2){ clog('copy failed: '+e2.message); return false; }
  }
}
$('copylink').onclick=async()=>{

};

/* ---------------- playlists ---------------- */
let PLS=[], CURPL=null, DRAGFROM=null;
const plmsg=(t,c)=>{ $('plmsg').innerHTML = t? `<div class="msg ${c||''}">${t}</div>`:''; };

async function loadPlaylists(keepId){
  try{
    const j=await api('/api/playlists');
    PLS=j.playlists||[];
    const want = keepId || (CURPL && CURPL.id) || (PLS[0]&&PLS[0].id);
    $('plsel').innerHTML = PLS.length
      ? PLS.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')
      : '<option value="">no playlists yet</option>';

    CURPL = PLS.find(p=>p.id===$('plsel').value) || null;
    renderItems();
  }catch(e){ plmsg(e.message,'err'); }
}
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderItems(){
  const box=$('plitems');
  const keepScroll=box.scrollTop;
  if(!CURPL){ box.innerHTML=''; $('plcount').textContent=''; return; }
  $('plcount').textContent = CURPL.items.length+' item'+(CURPL.items.length===1?'':'s');
  box.innerHTML = CURPL.items.map((it,i)=>`
    <div class="pli" draggable="true" data-idx="${i}">
      <span class="pli-n">${i+1}</span>
      <img class="pli-thumb" src="${esc(it.thumb||'')}" alt="" onerror="this.style.visibility='hidden'">
      <span class="pli-t" title="${esc(it.title)}">${esc(it.title)}</span>
      <span class="pli-d">${it.duration?fmt(it.duration):'·'}</span>
      <button class="pli-b" data-a="queue" title="Add to queue">＋</button>
      <button class="pli-b play" data-a="play" title="Play from here">▶</button>
      <button class="pli-b del" data-a="del" title="Remove">✕</button>
    </div>`).join('');
  box.scrollTop=keepScroll;
}

$('plitems').addEventListener('click', async e=>{
  const row=e.target.closest('.pli'); if(!row||!CURPL) return;
  const idx=+row.dataset.idx, act=e.target.dataset.a;

      CURPL=j.playlist; renderItems(); }catch(err){ plmsg(err.message,'err'); }
  } else if(act==='queue'){
    const it=CURPL.items[idx]; if(!it) return;
    try{ const j=await api('/api/queue/add',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({url:it.url})});
      plmsg(`queued "${it.title.slice(0,34)}" (${j.total} in queue)`,'ok');
      setTimeout(()=>plmsg(''),2500);
    }catch(err){ plmsg(err.message,'err'); }
  } else { playFrom(idx); }
});

function playFrom(idx){ confirmReplace('Playing this playlist', ()=>doPlayFrom(idx)); }
async function doPlayFrom(idx){
  if(!CURPL) return;
  const dev=$('device').value; if(!dev) return plmsg('pick a speaker first','err');
  plmsg('loading onto the speaker…');
  try{
    await api(`/api/playlists/${CURPL.id}/play`,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({index:idx, shuffle:false,
                           repeat:$('repeat').dataset.mode||'off'})});

$('plsel').onchange=()=>{ CURPL=PLS.find(p=>p.id===$('plsel').value)||null; renderItems(); };
/* Electron defines window.prompt but calling it throws "prompt() is not
   supported", so the New and Rename buttons silently did nothing. Inline

function openEdit(mode,val){

$('plnew').onclick=()=>openEdit('new','');

/* two-step delete rather than confirm() - keeps every interaction inline */
let DELARM=false, DELT=null;
function disarmDel(){ DELARM=false; clearTimeout(DELT);
  $('pldel').textContent='Delete'; $('pldel').classList.remove('tog','on'); }
$('pldel').onclick=async()=>{
  if(!CURPL) return;
  if(!DELARM){
    DELARM=true; $('pldel').textContent='Confirm delete';
    $('pldel').classList.add('tog','on');
    DELT=setTimeout(disarmDel,4000); return;
  }
  disarmDel();
  try{
    await api(`/api/playlists/${CURPL.id}`,{method:'DELETE'});
    CURPL=null; await loadPlaylists();
  }catch(e){ plmsg(e.message,'err'); }
};
/* Adds are queued server-side and resolve in the background, so the button
   never blocks and links can be pasted back to back. */
let JOBPOLL=null;
$('pladdbtn').onclick=async()=>{
  if(!CURPL) return plmsg('create a playlist first','err');
  const url=$('pladd').value.trim(); if(!url) return;
  $('pladd').value=''; $('pladd').focus();
  try{
    await api(`/api/playlists/${CURPL.id}/add`,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
    pollJobs();
  }catch(e){ plmsg(e.message,'err'); }
};

async function pollJobs(){
  if(JOBPOLL) return;
  const step=async()=>{
    try{
      const j=await api('/api/jobs');
      const done=j.jobs.filter(x=>x.state==='done').length;
      const bad=j.jobs.filter(x=>x.state==='error');
      if(j.busy>0) plmsg(`resolving ${j.busy} link${j.busy===1?'':'s'}…`);
      else if(bad.length) plmsg(bad[bad.length-1].msg||'failed to resolve','err');
      else plmsg('');
      if(CURPL){                       // pull in whatever has landed
        const pl=(await api('/api/playlists')).playlists.find(p=>p.id===CURPL.id);
        if(pl && JSON.stringify(pl.items)!==JSON.stringify(CURPL.items)){
          CURPL=pl; renderItems();
        }
      }
      if(j.busy===0){ clearInterval(JOBPOLL); JOBPOLL=null;
        setTimeout(()=>{ if(!JOBPOLL) plmsg(''); },2500); }
    }catch(e){ clearInterval(JOBPOLL); JOBPOLL=null; }
  };
  JOBPOLL=setInterval(step,1200); step();
}
$('pladd').addEventListener('keydown',e=>{ if(e.key==='Enter') $('pladdbtn').click(); });
$('plplay').onclick=()=>playFrom(0);

/* drag to reorder */
$('plitems').addEventListener('dragstart',e=>{ const r=e.target.closest('.pli'); if(!r)return;
  DRAGFROM=+r.dataset.idx; e.dataTransfer.effectAllowed='move'; });
$('plitems').addEventListener('dragover',e=>{ e.preventDefault();
  const r=e.target.closest('.pli'); if(!r)return;
  document.querySelectorAll('.pli.dragover').forEach(x=>x.classList.remove('dragover'));

/* transport */
/* The server answers with the target track immediately and loads it on the
   speaker afterwards, so the UI can show the change at once instead of waiting
   several seconds for the next status poll. */
let SKIPHOLD=0, SKIPVID=null;
async function skip(dir){
  const btn = dir>0 ? $('next') : $('prev');
  btn.disabled=true;
  try{
    const j=await api('/api/queue/'+(dir>0?'next':'prev'),{method:'POST'});
    if(j.ended){ tmsg('end of playlist','ok'); setTimeout(()=>tmsg(''),2500); }
    else if(j.item){ applySkipView(j); }
  }catch(e){ tmsg(e.message,'err'); setTimeout(()=>tmsg(''),3000); }
  btn.disabled=false;
}

function applySkipView(j){
  SKIPHOLD=Date.now()+15000; SKIPVID=j.item.video_id||null;
  $('title').textContent=j.item.title||'';
  $('state').textContent='LOADING'; $('dot').className='dot buf';
  $('tcur').textContent='0:00';
  $('tdur').textContent=j.item.duration?fmt(j.item.duration):'0:00';
  DUR=j.item.duration||0; paintBar(0);
  $('recv').textContent=`${j.pos+1}/${j.total}`;
      /* Mounting the new video now would leave it running against a speaker
         still on the old track. Hold a spinner until the speaker catches up. */
  WAITVID=j.item.video_id||null;
  if($('showvid').checked) showLoading(true);
  updateLink(WAITVID,0);
  if(typeof j.pos==='number') highlightQueue(j.pos, j.total);
}
$('prev').onclick=()=>skip(-1);
$('next').onclick=()=>skip(1);
/* The receiver's own shuffle only reshuffles on wrap-around, so this reorders
   the queue on the speaker instead - a one-shot action, not a sticky mode. */
$('shuffle').title='Shuffle the queue now';
$('shuffle').onclick=async()=>{
  if(QTOTAL<2) return tmsg('nothing queued to shuffle','err');
  $('shuffle').disabled=true; tmsg('shuffling…');
  try{ await api('/api/queue/mode',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({shuffle:true})}); QV=-1; tmsg('queue shuffled','ok');
    setTimeout(()=>tmsg(''),2000); }
  catch(e){ tmsg(e.message,'err'); }
  $('shuffle').disabled=false;
};
const RMODES=['off','all','one'];
function paintRepeat(m){
  $('repeat').dataset.mode=m;
  $('repeat').title='Repeat: '+m;
  $('repeat').classList.toggle('on', m!=='off');
  $('repeat').classList.toggle('one', m==='one');
}
paintRepeat('off');
$('repeat').onclick=async()=>{
  const nx=RMODES[(RMODES.indexOf($('repeat').dataset.mode||'off')+1)%3];
  paintRepeat(nx);
  try{ await api('/api/queue/mode',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({repeat:nx})}); }catch(e){}
};

/* The "up next" panel mirrors the live queue. The playlist behind it is fetched
   once per queue rather than shipped on every status poll. */
let QV=-1, QITEMS=[];
/* Highlight moves on its own so a skip shows in the sidebar instantly, without
   waiting for the status poll that is deliberately held during a skip. */
let LASTQPOS=-1;
/* scrollIntoView() also scrolls every ancestor scroll container, including the
   page itself - running that on each status poll yanked the window back up
   while you were scrolling. Scroll only the queue box, and only when the
   highlighted track actually changes. */
function scrollQueueInto(el){
  const box=$('qitems');
  if(!el||!box) return;
  const top=el.offsetTop, bot=top+el.offsetHeight;
  if(top<box.scrollTop) box.scrollTop=top;
  else if(bot>box.scrollTop+box.clientHeight) box.scrollTop=bot-box.clientHeight;
}
function highlightQueue(pos,total){
  let cur=null;
  $('qitems').querySelectorAll('.qi').forEach(el=>{
    const on=(+el.dataset.qpos===pos);
    el.classList.toggle('now',on);
    if(on) cur=el;
  });
  if(pos!==LASTQPOS){ LASTQPOS=pos; scrollQueueInto(cur); }
  if(total!=null) $('qmeta').textContent=`${pos+1} / ${total}`;
}
async function renderQueue(q){
  /* the panel only earns its space when something is actually queued behind
     the current track */
  document.body.classList.toggle('noqueue', !(q && q.total > 1));
  if(!q || q.total<2){ QV=-1; QITEMS=[]; LASTQPOS=-1;
    $('qitems').innerHTML=''; $('qmeta').textContent=''; return; }
  if(q.version!==QV){
    try{ const j=await api('/api/queue');
      if(j && j.items){ QITEMS=j.items; QV=q.version; LASTQPOS=-1;
        $('qitems').innerHTML=QITEMS.map((it,n)=>`<div class="qi" data-qpos="${n}">
          <span class="qi-n">${n+1}</span>
          <img class="qi-th" src="${esc(it.thumb||'')}" alt="" onerror="this.style.visibility='hidden'">
          <span class="qi-t" title="${esc(it.title)}">${esc(it.title)}</span>
          <span class="qi-d">${it.duration?fmt(it.duration):'·'}</span></div>`).join('');
      }
    }catch(e){ return; }
  }
  highlightQueue(q.pos,q.total);
}
$('qitems').addEventListener('click', async e=>{
  const row=e.target.closest('.qi'); if(!row) return;
  const pos=+row.dataset.qpos;
  highlightQueue(pos);                    // optimistic
  try{
    const j=await api('/api/queue/goto',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({pos})});
    if(j.item) applySkipView(j);
  }catch(err){ tmsg(err.message,'err'); setTimeout(()=>tmsg(''),3000); }
});

async function queueAdd(body,where){
  try{
    const j=await api('/api/queue/add',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    where(`queued ${j.added} — ${j.total} in queue`,'ok');
  }catch(e){ where(e.message,'err'); }
}
$('queueadd').onclick=async()=>{
  const url=$('url').value.trim(); if(!url) return msg('paste a link first','err');
  $('queueadd').disabled=true; msg('adding to queue…');
  await queueAdd({url}, (t,c)=>{ msg(t,c); setTimeout(()=>msg(''),2500); });
  $('url').value=''; $('queueadd').disabled=false;
};
$('plqueue').onclick=async()=>{
  if(!CURPL) return plmsg('pick a playlist first','err');
  await queueAdd({playlistId:CURPL.id},(t,c)=>{ plmsg(t,c); setTimeout(()=>plmsg(''),2500); });
};

async function tick(){
  try{
    const s=await api('/api/status');
    if(!s.connected){
      clearVideo('Not connected to a speaker yet. Pick one above.');
      QTOTAL=0; renderQueue(null);
    }
    if(!s.connected){ clearVideo('Not connected to a speaker yet. Pick one above.');
                      QTOTAL=0; renderQueue(null); }
    if(s.connected){
      $('state').textContent=s.state||'—';
      $('dot').className='dot '+(s.state==='PLAYING'?'on':s.state==='BUFFERING'?'buf':'');
      $('rebuf').textContent=s.rebuffers??0;
      $('recv').textContent=s.app||'—';
      if(s.media) $('codec').textContent=`${s.media.acodec||'?'} ${s.media.abr?Math.round(s.media.abr)+'k':''}`;
      if(s.media&&s.media.title) $('title').textContent=s.media.title;
      const pos=s.position||0, dur=s.duration||0;
      if(SKIPHOLD && Date.now()<SKIPHOLD){
        // a skip is in flight: hold the optimistic view until the speaker is
        // actually on the track we asked for
        if(!(s.media && SKIPVID && s.media.video_id===SKIPVID)){ setTimeout(tick,1000); return; }
        SKIPHOLD=0; SKIPVID=null;
      }
      DUR=dur;
      bar().classList.toggle('disabled', !dur);
      $('tdur').textContent=fmt(dur);
      const locked = seekLock && Date.now()<seekLock && seekTarget!=null
                     && Math.abs(pos-seekTarget)>3;
      if(!locked){
        if(seekLock && seekTarget!=null && Math.abs(pos-seekTarget)<=3){
          seekLock=0; seekTarget=null;              // receiver caught up
        }
        if(!scrubbing){
          $('tcur').textContent=fmt(pos);
          paintBar(dur? pos/dur : 0);
        }
      }
      if(typeof s.volume==='number' && document.activeElement!==$('vol'))
        $('vol').value=Math.round(s.volume*100);
      updateLink(s.media && s.media.video_id, pos);
      const q=s.queue;
      $('prev').disabled = !(q && q.can_prev);
      $('next').disabled = !(q && q.can_next);
      renderQueue(q);
      if(WAITVID){
        // only show the video once the speaker is actually on that track
        if(s.media && s.media.video_id===WAITVID && s.state==='PLAYING'){
          const v=WAITVID; WAITVID=null;
          if($('showvid').checked) mountVideo(v); else showLoading(false);
        }
      }
      QTOTAL = q ? q.total : 0;
      if(q){
        $('recv').textContent = q.filling
          ? `${q.pos+1}/${q.total} · loading ${q.filling.done}/${q.filling.total}`
          : `${q.pos+1}/${q.total} on speaker`;
        if(($('repeat').dataset.mode||'off')!==q.repeat) paintRepeat(q.repeat);
      }
      if(s.media&&s.media.video_id&&$('showvid').checked) mountVideo(s.media.video_id);
      else if(s.media&&!s.media.video_id&&s.media.identified&&s.media.identified.confidence==='none')
        $('noplayer').textContent="Couldn't identify this stream, so there's no video to show. "
          +"Audio controls still work. Cast a link here to get the synced video.";
      if(YT_PLAYER&&YT_PLAYER.getCurrentTime&&$('showvid').checked&&!SYNCING
         &&!scrubbing&&!seekLock){
        const local=YT_PLAYER.getCurrentTime()||0;
        if(s.state==='PLAYING'){
          if(Math.abs(local-pos)>1.5){SYNCING=true;YT_PLAYER.seekTo(pos,true);
            YT_PLAYER.playVideo();setTimeout(()=>SYNCING=false,1200);}
          else if(YT_PLAYER.getPlayerState&&YT_PLAYER.getPlayerState()!==1) YT_PLAYER.playVideo();
        } else if(s.state==='PAUSED'&&YT_PLAYER.pauseVideo) YT_PLAYER.pauseVideo();
      }
    }
  }catch(e){}
  setTimeout(tick,1000);
}
loadDevices(false); loadPlaylists(); tick();
</script>
