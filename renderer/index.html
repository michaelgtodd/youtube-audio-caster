<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube Audio Caster</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#fff; --ink:#16171a; --muted:#6b7076; --line:#e3e5e8;
  --accent:#2f6df6; --ok:#0f9d58; --warn:#d93025; --chip:#eef1f5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f1113; --panel:#17191d; --ink:#e9eaec; --muted:#9aa0a6; --line:#2a2d33;
  --accent:#6f9bff; --ok:#4ade80; --warn:#ff7b72; --chip:#22252b;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:19px;margin:0 0 2px;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],select{
  background:var(--bg);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit}
input[type=text]{flex:1;min-width:260px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;
  padding:10px 16px;font-size:14px;font-weight:560;cursor:pointer;font-family:inherit}
button.ghost{background:var(--chip);color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
#playerwrap{width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
#player,#playerwrap iframe{width:100%;height:100%;border:0;display:block}
.hide{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:14px}
.stat{background:var(--chip);border-radius:9px;padding:10px 12px}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:16px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.buf{background:#e8a33d} .dot.err{background:var(--warn)}
.bar{position:relative;height:18px;display:flex;align-items:center;margin:8px 0 2px;
  cursor:pointer;touch-action:none;user-select:none}
.bar .track{position:relative;width:100%;height:5px;background:var(--chip);border-radius:99px}
.bar .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:99px}
.bar .thumb{position:absolute;top:50%;left:0;width:12px;height:12px;margin:-6px 0 0 -6px;
  border-radius:50%;background:var(--accent);opacity:0;transition:opacity .12s}
.bar:hover .thumb,.bar.scrubbing .thumb{opacity:1}
.bar .bubble{position:absolute;bottom:22px;left:0;transform:translateX(-50%);white-space:nowrap;
  background:var(--ink);color:var(--panel);font-size:11px;padding:2px 6px;border-radius:5px;
  opacity:0;pointer-events:none;font-variant-numeric:tabular-nums;transition:opacity .12s}
.bar:hover .bubble,.bar.scrubbing .bubble{opacity:1}
.bar.disabled{cursor:default}
.bar.disabled .thumb,.bar.disabled .bubble{display:none}
.time{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-top:10px}
.msg.err{background:rgba(217,48,37,.12);color:var(--warn)}
.msg.ok{background:rgba(15,157,88,.12);color:var(--ok)}
.meta{font-size:12.5px;color:var(--muted);margin-top:10px;word-break:break-word}
label.sm{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.aud{font-size:11px;background:var(--chip);border-radius:5px;padding:1px 6px;color:var(--muted)}
#plitems{margin-top:12px;max-height:340px;overflow-y:auto;border-radius:9px}
#plitems:empty{display:none}
.pli{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer}
.pli:hover{background:var(--chip)}
.pli.now{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.pli.now .pli-t{color:var(--accent);font-weight:600}
.pli.dragover{outline:2px dashed var(--accent);outline-offset:-2px}
.pli-n{width:22px;text-align:right;font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;flex:none}
.pli-thumb{width:56px;height:32px;object-fit:cover;border-radius:4px;background:var(--chip);flex:none}
.pli-t{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pli-d{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.pli-b{background:none;color:var(--muted);border:0;padding:3px 6px;font-size:13px;
  cursor:pointer;border-radius:5px;flex:none;opacity:0}
.pli:hover .pli-b{opacity:1}
.pli-b:hover{background:var(--bg);color:var(--ink)}
.tog{background:var(--chip);color:var(--muted)}
.tog.on{background:var(--accent);color:#fff}
#linkrow{display:none;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
#expand{margin-left:auto}
#exitexpand{display:none;position:fixed;top:12px;right:14px;z-index:70}
body.theater{overflow:hidden}                 /* the scrollbar was eating the right edge */
body.theater .wrap{padding:0;max-width:none;height:100vh;overflow:hidden}
body.theater .card:not(#playercard){display:none}
body.theater #playercard{position:fixed;inset:0;margin:0;padding:0;border:0;border-radius:0;
  background:#000;z-index:40;overflow:hidden}
body.theater #playercard>*:not(#playerwrap){display:none}
body.theater #playerwrap{position:absolute;inset:0;width:100%;height:100%;
  aspect-ratio:auto;border-radius:0}
body.theater #playerwrap iframe{width:100%;height:100%}
body.theater #exitexpand{display:block;opacity:.25;transition:opacity .15s}
body.theater #exitexpand:hover{opacity:1}
#playerwrap:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0;background:#000}
#playerwrap:fullscreen iframe{width:100%;height:100%}
#ytlink{flex:1;min-width:200px;font-size:12.5px;color:var(--accent);text-decoration:none;
  background:var(--chip);border-radius:7px;padding:7px 10px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
#ytlink:hover{text-decoration:underline}
button.mini{padding:7px 12px;font-size:12.5px}
button.mini.done{background:var(--ok)}
</style>
</head>
<body>
<button class="ghost mini" id="exitexpand" title="Exit theater mode (Esc)">✕ Exit</button>
<div class="wrap">
  <h1>YouTube Audio Caster</h1>
  <div class="sub">Native buffered audio to a Cast speaker &middot; video stays local &amp; synced</div>

  <div class="card">
    <div class="row">
      <input type="text" id="url" placeholder="Paste a YouTube link…"
             value="">
      <select id="device"></select>
      <button id="go">Cast</button>
      <button class="ghost" id="rescan" title="Re-scan for devices" aria-label="Re-scan for devices"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg></button>
    </div>
    <div id="msg"></div>
  </div>

  <div class="card" id="playercard">
    <div id="playerwrap" class="hide"><div id="player"></div></div>
    <div id="noplayer" class="meta">Video appears here once you cast. Audio goes to the speaker;
      this player is muted and follows the speaker's position.</div>

    <div class="bar disabled" id="bar" title="click or drag to seek">
      <div class="track"><div class="fill" id="prog"></div><div class="thumb" id="thumb"></div></div>
      <div class="bubble" id="bubble">0:00</div>
    </div>
    <div class="time"><span id="tcur">0:00</span><span id="tdur">0:00</span></div>

    <div class="row" style="margin-top:12px">
      <button class="ghost" id="play">▶︎ Play</button>
      <button class="ghost" id="pause">❚❚ Pause</button>
      <button class="ghost" id="stop">■ Stop</button>
      <button class="ghost" id="refresh" title="Re-issue an expired CDN url and resume">↻ Refresh stream</button>
      <label class="sm" style="margin-left:auto">vol
        <input type="range" id="vol" min="0" max="100" value="80" style="width:110px">
      </label>
      <label class="sm"><input type="checkbox" id="showvid" checked> show video</label>
      <button class="ghost mini" id="expand" title="Fill the window (Esc to exit)">⤢ Theater</button>
      <button class="ghost mini" id="fullscreen" title="True fullscreen (Esc to exit)">⛶ Fullscreen</button>
    </div>

    <div class="grid">
      <div class="stat"><div class="k">state</div><div class="v"><span class="dot" id="dot"></span><span id="state">idle</span></div></div>
      <div class="stat"><div class="k">rebuffers</div><div class="v" id="rebuf">0</div></div>
      <div class="stat"><div class="k">receiver</div><div class="v" id="recv" style="font-size:13px">—</div></div>
      <div class="stat"><div class="k">audio</div><div class="v" id="codec" style="font-size:13px">—</div></div>
    </div>
    <div class="meta" id="title"></div>
    <div id="linkrow">
      <a id="ytlink" href="#" target="_blank" rel="noreferrer" title="open in your browser"></a>
      <button class="ghost mini" id="copylink">Copy</button>
      <label class="sm"><input type="checkbox" id="attime"> at current time</label>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <select id="plsel" style="min-width:190px"></select>
      <button class="ghost mini" id="plnew">+ New</button>
      <button class="ghost mini" id="plrename">Rename</button>
      <button class="ghost mini" id="pldel">Delete</button>
      <span class="meta" id="plcount" style="margin-left:auto"></span>
    </div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="pladd" placeholder="Paste a video or playlist link to add…">
      <button class="ghost mini" id="pladdbtn">Add</button>
      <button class="mini" id="plplay">▶ Play all</button>
    </div>
    <div id="plmsg"></div>
    <div id="plitems"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let YT_PLAYER=null, YT_READY=false, CUR_VID=null, SYNCING=false, PENDING_VID=null;

/* send diagnostics to the server log so problems are visible without a debugger */
function clog(msg){ try{ fetch('/api/clientlog',{method:'POST',
  headers:{'Content-Type':'application/json'},body:JSON.stringify({msg})}); }catch(e){} }
window.addEventListener('error', e => clog('js error: '+e.message));

/* The IFrame API is loaded programmatically and POLLED for readiness. Relying on
   the onYouTubeIframeAPIReady callback alone is fragile: if the script is served
   from cache or fails to load, the callback may never fire and the player would
   silently never mount. */
function loadYTApi(){
  if(window.YT && window.YT.Player){ YT_READY=true; return; }
  if(!document.getElementById('ytapi')){
    const t=document.createElement('script');
    t.id='ytapi'; t.src='https://www.youtube.com/iframe_api';
    t.onerror=()=>clog('iframe_api FAILED to load');
    document.head.appendChild(t);
  }
}
window.onYouTubeIframeAPIReady=()=>{ YT_READY=true; clog('YT api ready (callback)');
  if(PENDING_VID){const v=PENDING_VID; PENDING_VID=null; mountVideo(v);} };

let ytWaited=0;
setInterval(()=>{
  if(YT_READY) return;
  if(window.YT && window.YT.Player){ YT_READY=true; clog('YT api ready (poll)');
    if(PENDING_VID){const v=PENDING_VID; PENDING_VID=null; mountVideo(v);} return; }
  ytWaited+=500;
  if(ytWaited===5000) clog('YT api still not ready after 5s - retrying load');
  if(ytWaited%5000===0){ const old=document.getElementById('ytapi'); if(old) old.remove(); loadYTApi(); }
}, 500);
loadYTApi();

function fmt(s){s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),
  m=Math.floor(s%3600/60),x=s%60;
  return h? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`
          : `${m}:${String(x).padStart(2,'0')}`;}
function msg(t,cls){$('msg').innerHTML = t? `<div class="msg ${cls||''}">${t}</div>`:'';}

function mountVideo(vid){
  if(!vid) return;
  if(!YT_READY){ PENDING_VID=vid; clog('mount deferred, api not ready: '+vid); return; }
  if(vid===CUR_VID && YT_PLAYER) return;
  CUR_VID=vid;
  $('playerwrap').classList.remove('hide'); $('noplayer').classList.add('hide');
  clog('mounting '+vid);
  try{
    if(YT_PLAYER && YT_PLAYER.loadVideoById){ YT_PLAYER.loadVideoById(vid); YT_PLAYER.mute(); return; }
    YT_PLAYER=new YT.Player('player',{videoId:vid,
      playerVars:{autoplay:1,controls:0,mute:1,rel:0,modestbranding:1,playsinline:1,
                  disablekb:1,iv_load_policy:3},
      events:{onReady:e=>{e.target.mute();e.target.playVideo();clog('player ready');},
              onError:e=>clog('player error code '+e.data)}});
  }catch(e){ clog('mount threw: '+e.message); CUR_VID=null; }
}

async function api(p,o){const r=await fetch(p,o);let j={};try{j=await r.json()}catch(e){}
  if(!r.ok) throw new Error(j.error||('HTTP '+r.status)); return j;}

async function loadDevices(refresh){
  $('device').innerHTML='<option>scanning…</option>';
  try{
    const j=await api('/api/devices'+(refresh?'?refresh=1':''));
    $('device').innerHTML = j.devices.map(d=>
      `<option value="${d.name}">${d.name}${d.audio_only?' — speaker':''}</option>`).join('')
      || '<option value="">none found</option>';
    const pref = j.connected || j.preferred;
    const have = pref && [...$('device').options].some(o=>o.value===pref);
    if(have) $('device').value=pref;
    /* Only auto-attach to a device we have actually used before. Attaching to
       whatever happened to sort first grabs an arbitrary speaker - and if that
       one is idle, it looks exactly like "nothing is playing". */
    if(have) attach();
    else { msg('pick a speaker to connect','ok');
           $('noplayer').textContent='Choose a speaker above, then cast a link.'; }
  }catch(e){ $('device').innerHTML='<option value="">scan failed</option>'; msg(e.message,'err'); }
}

async function attach(){
  const dev=$('device').value; if(!dev) return;
  try{
    const j=await api('/api/attach',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({device:dev})});
    const vid = j.media && j.media.video_id;
    clog('attach adopted='+j.adopted+' video_id='+vid);
    if(vid){                       // identified: show it, whoever started it
      msg('attached to the session playing on '+dev,'ok');
      mountVideo(vid);
    } else if(j.adopted){          // adopted but not yet identified - tick() may still mount
      msg('attached to the session playing on '+dev,'ok');
      $('noplayer').textContent='Working out what is playing…';
    } else msg('');
  }catch(e){ msg(e.message,'err'); }
}

$('go').onclick=async()=>{
  const url=$('url').value.trim(), device=$('device').value;
  if(!url) return msg('paste a link first','err');
  $('go').disabled=true; msg('extracting audio-only stream & casting…');
  try{
    const j=await api('/api/cast',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url,device})});
    msg(`casting to ${device}`,'ok');
    if(j.media&&j.media.video_id&&$('showvid').checked) mountVideo(j.media.video_id);
    $('title').textContent=j.media.title||'';
  }catch(e){ msg(e.message,'err'); }
  $('go').disabled=false;
};
$('url').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
$('rescan').onclick=()=>loadDevices(true);
$('device').onchange=()=>attach();
for(const a of ['play','pause','stop','refresh'])
  $(a).onclick=()=>api('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:a})}).catch(e=>msg(e.message,'err'));
$('vol').onchange=e=>api('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({action:'volume',value:e.target.value/100})}).catch(()=>{});
$('showvid').onchange=e=>{
  if(!e.target.checked){$('playerwrap').classList.add('hide');$('noplayer').classList.remove('hide');
    if(YT_PLAYER&&YT_PLAYER.pauseVideo)YT_PLAYER.pauseVideo();}
  else if(CUR_VID){$('playerwrap').classList.remove('hide');$('noplayer').classList.add('hide');
    if(YT_PLAYER&&YT_PLAYER.playVideo)YT_PLAYER.playVideo();}
};

/* Cast exposes a native seek: the speaker re-buffers from the CDN over range
   requests. The only trick is not letting status polling snap the bar backwards
   before the receiver reports the new position. */
let DUR=0, scrubbing=false, seekLock=0, seekTarget=null;
const bar=()=>$('bar');
function pctAt(e){ const r=bar().getBoundingClientRect();
  return Math.max(0, Math.min(1, (e.clientX-r.left)/r.width)); }
function paintBar(pct){
  const s=(pct*100).toFixed(2)+'%';
  $('prog').style.width=s; $('thumb').style.left=s; $('bubble').style.left=s;
}
function showBubble(pct){ $('bubble').textContent=fmt(pct*DUR); $('bubble').style.left=(pct*100)+'%'; }

bar().addEventListener('pointermove', e=>{
  if(!DUR) return;
  const p=pctAt(e); showBubble(p);
  if(scrubbing){ paintBar(p); $('tcur').textContent=fmt(p*DUR); }
});
bar().addEventListener('pointerdown', e=>{
  if(!DUR) return;
  scrubbing=true; bar().classList.add('scrubbing'); bar().setPointerCapture(e.pointerId);
  const p=pctAt(e); paintBar(p); showBubble(p); $('tcur').textContent=fmt(p*DUR);
});
bar().addEventListener('pointerup', async e=>{
  if(!scrubbing) return;
  scrubbing=false; bar().classList.remove('scrubbing');
  try{ bar().releasePointerCapture(e.pointerId); }catch(_){}
  await doSeek(pctAt(e)*DUR);
});

async function doSeek(t){
  if(!DUR) return;
  t=Math.max(0,Math.min(DUR-1,t));
  seekTarget=t; seekLock=Date.now()+6000;      // hold the UI at the target
  paintBar(t/DUR); $('tcur').textContent=fmt(t);
  if(YT_PLAYER&&YT_PLAYER.seekTo){ SYNCING=true; YT_PLAYER.seekTo(t,true);
    setTimeout(()=>SYNCING=false,1500); }
  try{
    await api('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'seek',value:t})});
    clog('seek -> '+Math.round(t)+'s');
  }catch(e){ msg('seek failed: '+e.message,'err'); seekLock=0; seekTarget=null; }
}

/* The url actually being played is a ~900-char googlevideo CDN blob that is
   IP-bound and expires. Show the shareable watch url instead, optionally
   stamped with the current position. */
let LINK_VID=null, LINK_POS=0;
function updateLink(vid, pos){
  LINK_VID=vid; LINK_POS=pos||0;
  if(!vid){ $('linkrow').style.display='none'; return; }
  const t=$('attime').checked ? Math.floor(LINK_POS) : null;
  const url='https://www.youtube.com/watch?v='+vid+(t?('&t='+t+'s'):'');
  const a=$('ytlink');
  if(a.textContent!==url){ a.textContent=url; a.href=url; }
  $('linkrow').style.display='flex';
}
$('attime').addEventListener('change',()=>updateLink(LINK_VID,LINK_POS));

async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){
    try{                                   // fallback if the async API is unavailable
      const ta=document.createElement('textarea');
      ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      const ok=document.execCommand('copy'); ta.remove(); return ok;
    }catch(e2){ clog('copy failed: '+e2.message); return false; }
  }
}
$('copylink').onclick=async()=>{
  const b=$('copylink'), url=$('ytlink').textContent;
  if(!url) return;
  const ok=await copyText(url);
  b.textContent = ok ? 'Copied ✓' : 'Copy failed';
  b.classList.toggle('done', ok);
  clog('copy link '+(ok?'ok':'FAILED'));
  setTimeout(()=>{ b.textContent='Copy'; b.classList.remove('done'); }, 1400);
};
clog('clipboard api available: '+(!!(navigator.clipboard&&navigator.clipboard.writeText)));

function setTheater(on){
  document.body.classList.toggle('theater', on);
  if(on && !$('showvid').checked){ $('showvid').checked=true; $('showvid').dispatchEvent(new Event('change')); }
}
$('expand').onclick=()=>setTheater(!document.body.classList.contains('theater'));
/* Fullscreen OUR wrapper rather than asking the YouTube player to do it. The
   iframe simply fills the fullscreened element, so the player needs no controls
   and no fs:1 - the video goes edge to edge with zero YouTube chrome. */
$('fullscreen').onclick=async()=>{
  const el=$('playerwrap');
  if(!CUR_VID){ msg('nothing to show yet','err'); return; }
  try{
    if(document.fullscreenElement) await document.exitFullscreen();
    else { if(!$('showvid').checked){ $('showvid').checked=true; $('showvid').dispatchEvent(new Event('change')); }
           await el.requestFullscreen({navigationUI:'hide'}); }
  }catch(e){ clog('fullscreen failed: '+e.message); msg('fullscreen failed: '+e.message,'err'); }
};
$('exitexpand').onclick=()=>setTheater(false);
/* Esc backs out of theater mode here; main.js handles Esc for OS fullscreen. */
window.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.body.classList.contains('theater')){ setTheater(false); }
});

/* ---------------- playlists ---------------- */
let PLS=[], CURPL=null, NOWIDX=-1, DRAGFROM=null;
const plmsg=(t,c)=>{ $('plmsg').innerHTML = t? `<div class="msg ${c||''}">${t}</div>`:''; };

async function loadPlaylists(keepId){
  try{
    const j=await api('/api/playlists');
    PLS=j.playlists||[];
    const want = keepId || (CURPL && CURPL.id) || (PLS[0]&&PLS[0].id);
    $('plsel').innerHTML = PLS.length
      ? PLS.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')
      : '<option value="">no playlists yet</option>';
    if(want && PLS.some(p=>p.id===want)) $('plsel').value=want;
    CURPL = PLS.find(p=>p.id===$('plsel').value) || null;
    renderItems();
  }catch(e){ plmsg(e.message,'err'); }
}
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderItems(){
  const box=$('plitems');
  if(!CURPL){ box.innerHTML=''; $('plcount').textContent=''; return; }
  $('plcount').textContent = CURPL.items.length+' item'+(CURPL.items.length===1?'':'s');
  box.innerHTML = CURPL.items.map((it,i)=>`
    <div class="pli${i===NOWIDX?' now':''}" draggable="true" data-idx="${i}">
      <span class="pli-n">${i+1}</span>
      <img class="pli-thumb" src="${esc(it.thumb||'')}" alt="" onerror="this.style.visibility='hidden'">
      <span class="pli-t" title="${esc(it.title)}">${esc(it.title)}</span>
      <span class="pli-d">${it.duration?fmt(it.duration):''}</span>
      <button class="pli-b play" data-a="play" title="Play from here">▶</button>
      <button class="pli-b del" data-a="del" title="Remove">✕</button>
    </div>`).join('');
}

$('plitems').addEventListener('click', async e=>{
  const row=e.target.closest('.pli'); if(!row||!CURPL) return;
  const idx=+row.dataset.idx, act=e.target.dataset.a;
  if(act==='del'){
    try{ const j=await api(`/api/playlists/${CURPL.id}/item/${idx}`,{method:'DELETE'});
      CURPL=j.playlist; renderItems(); }catch(err){ plmsg(err.message,'err'); }
  } else { playFrom(idx); }
});

async function playFrom(idx){
  if(!CURPL) return;
  const dev=$('device').value; if(!dev) return plmsg('pick a speaker first','err');
  plmsg('starting…');
  try{
    await api(`/api/playlists/${CURPL.id}/play`,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({index:idx, shuffle:$('shuffle').classList.contains('on'),
                           repeat:$('repeat').dataset.mode||'off'})});
    plmsg('');
  }catch(e){ plmsg(e.message,'err'); }
}

$('plsel').onchange=()=>{ CURPL=PLS.find(p=>p.id===$('plsel').value)||null; NOWIDX=-1; renderItems(); };
$('plnew').onclick=async()=>{
  const name=prompt('Playlist name:','My playlist'); if(!name) return;
  const j=await api('/api/playlists',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name})});
  loadPlaylists(j.playlist.id);
};
$('plrename').onclick=async()=>{
  if(!CURPL) return; const name=prompt('Rename playlist:',CURPL.name); if(!name) return;
  await api(`/api/playlists/${CURPL.id}/rename`,{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
  loadPlaylists(CURPL.id);
};
$('pldel').onclick=async()=>{
  if(!CURPL) return;
  if(!confirm(`Delete "${CURPL.name}"? This cannot be undone.`)) return;
  await api(`/api/playlists/${CURPL.id}`,{method:'DELETE'});
  CURPL=null; loadPlaylists();
};
$('pladdbtn').onclick=async()=>{
  if(!CURPL) return plmsg('create a playlist first','err');
  const url=$('pladd').value.trim(); if(!url) return;
  $('pladdbtn').disabled=true; plmsg('resolving… (a full playlist link can take a moment)');
  try{
    const j=await api(`/api/playlists/${CURPL.id}/add`,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
    CURPL=j.playlist; renderItems(); $('pladd').value='';
    plmsg(`added ${j.added} item${j.added===1?'':'s'}`,'ok');
    setTimeout(()=>plmsg(''),2500);
  }catch(e){ plmsg(e.message,'err'); }
  $('pladdbtn').disabled=false;
};
$('pladd').addEventListener('keydown',e=>{ if(e.key==='Enter') $('pladdbtn').click(); });
$('plplay').onclick=()=>playFrom(0);

/* drag to reorder */
$('plitems').addEventListener('dragstart',e=>{ const r=e.target.closest('.pli'); if(!r)return;
  DRAGFROM=+r.dataset.idx; e.dataTransfer.effectAllowed='move'; });
$('plitems').addEventListener('dragover',e=>{ e.preventDefault();
  const r=e.target.closest('.pli'); if(!r)return;
  document.querySelectorAll('.pli.dragover').forEach(x=>x.classList.remove('dragover'));
  r.classList.add('dragover'); });
$('plitems').addEventListener('drop',async e=>{
  e.preventDefault();
  document.querySelectorAll('.pli.dragover').forEach(x=>x.classList.remove('dragover'));
  const r=e.target.closest('.pli'); if(!r||DRAGFROM===null||!CURPL) return;
  const to=+r.dataset.idx;
  if(to===DRAGFROM){ DRAGFROM=null; return; }
  try{ const j=await api(`/api/playlists/${CURPL.id}/move`,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({from:DRAGFROM,to})});
    CURPL=j.playlist; renderItems(); }catch(err){ plmsg(err.message,'err'); }
  DRAGFROM=null;
});

/* transport */
$('prev').onclick=()=>api('/api/queue/prev',{method:'POST'}).catch(e=>plmsg(e.message,'err'));
$('next').onclick=()=>api('/api/queue/next',{method:'POST'}).catch(e=>plmsg(e.message,'err'));
$('shuffle').onclick=async()=>{
  const on=!$('shuffle').classList.contains('on');
  $('shuffle').classList.toggle('on',on);
  try{ await api('/api/queue/mode',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({shuffle:on})}); }catch(e){}
};
const RMODES=['off','all','one'], RLABEL={off:'↻',all:'↻ all',one:'↻ 1'};
$('repeat').dataset.mode='off';
$('repeat').onclick=async()=>{
  const cur=$('repeat').dataset.mode||'off';
  const nx=RMODES[(RMODES.indexOf(cur)+1)%3];
  $('repeat').dataset.mode=nx;
  $('repeat').textContent=RLABEL[nx];
  $('repeat').title='Repeat: '+nx;
  $('repeat').classList.toggle('on', nx!=='off');
  try{ await api('/api/queue/mode',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({repeat:nx})}); }catch(e){}
};

async function tick(){
  try{
    const s=await api('/api/status');
    if(s.connected){
      $('state').textContent=s.state||'—';
      $('dot').className='dot '+(s.state==='PLAYING'?'on':s.state==='BUFFERING'?'buf':'');
      $('rebuf').textContent=s.rebuffers??0;
      $('recv').textContent=s.app||'—';
      if(s.media) $('codec').textContent=`${s.media.acodec||'?'} ${s.media.abr?Math.round(s.media.abr)+'k':''}`;
      if(s.media&&s.media.title) $('title').textContent=s.media.title;
      const pos=s.position||0, dur=s.duration||0;
      DUR=dur;
      bar().classList.toggle('disabled', !dur);
      $('tdur').textContent=fmt(dur);
      const locked = seekLock && Date.now()<seekLock && seekTarget!=null
                     && Math.abs(pos-seekTarget)>3;
      if(!locked){
        if(seekLock && seekTarget!=null && Math.abs(pos-seekTarget)<=3){
          seekLock=0; seekTarget=null;              // receiver caught up
        }
        if(!scrubbing){
          $('tcur').textContent=fmt(pos);
          paintBar(dur? pos/dur : 0);
        }
      }
      if(typeof s.volume==='number' && document.activeElement!==$('vol'))
        $('vol').value=Math.round(s.volume*100);
      updateLink(s.media && s.media.video_id, pos);
      const q=s.queue;
      if(q){
        const idx=q.order[q.pos];
        if(CURPL && CURPL.id===q.playlistId && idx!==NOWIDX){ NOWIDX=idx; renderItems(); }
        $('recv').textContent=`${q.pos+1}/${q.total} · ${q.name}`.slice(0,30);
        if($('shuffle').classList.contains('on')!==q.shuffle) $('shuffle').classList.toggle('on',q.shuffle);
        if(($('repeat').dataset.mode||'off')!==q.repeat){
          $('repeat').dataset.mode=q.repeat; $('repeat').textContent=RLABEL[q.repeat];
          $('repeat').classList.toggle('on', q.repeat!=='off');
        }
      } else if(NOWIDX!==-1){ NOWIDX=-1; renderItems(); }
      if(s.media&&s.media.video_id&&$('showvid').checked) mountVideo(s.media.video_id);
      else if(s.media&&!s.media.video_id&&s.media.identified&&s.media.identified.confidence==='none')
        $('noplayer').textContent="Couldn't identify this stream, so there's no video to show. "
          +"Audio controls still work. Cast a link here to get the synced video.";
      if(YT_PLAYER&&YT_PLAYER.getCurrentTime&&$('showvid').checked&&!SYNCING
         &&!scrubbing&&!seekLock){
        const local=YT_PLAYER.getCurrentTime()||0;
        if(s.state==='PLAYING'){
          if(Math.abs(local-pos)>1.5){SYNCING=true;YT_PLAYER.seekTo(pos,true);
            YT_PLAYER.playVideo();setTimeout(()=>SYNCING=false,1200);}
          else if(YT_PLAYER.getPlayerState&&YT_PLAYER.getPlayerState()!==1) YT_PLAYER.playVideo();
        } else if(s.state==='PAUSED'&&YT_PLAYER.pauseVideo) YT_PLAYER.pauseVideo();
      }
    }
  }catch(e){}
  setTimeout(tick,1000);
}
loadDevices(false); loadPlaylists(); tick();
</script>
</body></html>
