name: Smoke test

# Runs the app on a real Windows machine. A tester found beta 1 starting as a
# process with no window, which nothing here could reproduce - this at least
# proves the startup path executes on Windows before anyone downloads a build.
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: Windows }
          - { os: macos-latest,   label: macOS }

    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Unit tests
        run: npm test

      # 1. the headless server: this is where mDNS binds udp/5353, the step most
      #    likely to behave differently on Windows
      - name: Server starts and answers
        shell: bash
        run: |
          PORT=8931 node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf --max-time 3 "http://127.0.0.1:8931/api/playlists" >/dev/null; then
              echo "server answered after ${i}s"; break; fi
            sleep 1
            if [ "$i" = "30" ]; then echo "SERVER NEVER ANSWERED"; cat server.log; exit 1; fi
          done
          echo "--- every endpoint must answer with sane json ---"
          for EP in /api/devices /api/playlists /api/queue /api/status /api/jobs /api/errors /api/settings; do
            BODY=$(curl -s --max-time 25 "http://127.0.0.1:8931$EP")
            echo "$BODY" | node -e "
              let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
                try { JSON.parse(d); console.log('  ok   $EP  ' + d.slice(0,70)); }
                catch(e){ console.log('  BAD  $EP  not json: ' + d.slice(0,70)); process.exit(1); }
              })"
          done
          echo "--- playlist round trip through the api ---"
          ID=$(curl -s -X POST -H 'Content-Type: application/json' -d '{"name":"CI"}' \
                 http://127.0.0.1:8931/api/playlists \
               | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).playlist.id))")
          curl -s -X POST -H 'Content-Type: application/json' -d '{"name":"CI renamed"}' \
            "http://127.0.0.1:8931/api/playlists/$ID/rename" >/dev/null
          curl -s "http://127.0.0.1:8931/api/playlists" | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              const p=JSON.parse(d).playlists[0];
              if(!p||p.name!=='CI renamed'){console.log('  playlist round trip FAILED');process.exit(1);}
              console.log('  playlist create+rename ok');})"
          curl -s -X DELETE "http://127.0.0.1:8931/api/playlists/$ID" >/dev/null
          echo "--- server log ---"; cat server.log

      # 2. the whole Electron startup path, which is what actually failed
      - name: Electron app starts and serves its UI
        shell: bash
        run: |
          npx electron . --no-sandbox > electron.log 2>&1 &
          PORT=""
          for i in $(seq 1 45); do
            PORT=$(grep -oE '127\.0\.0\.1:[0-9]+' electron.log 2>/dev/null | head -1 | cut -d: -f2 || true)
            if [ -n "$PORT" ] && curl -sf --max-time 3 "http://127.0.0.1:$PORT/" >/dev/null; then
              echo "app served its UI on port $PORT after ${i}s"; break; fi
            sleep 1
            if [ "$i" = "45" ]; then
              echo "APP NEVER SERVED ITS UI - this is the beta 1 failure"
              echo "--- electron log ---"; cat electron.log
              exit 1; fi
          done
          echo "--- electron log ---"; cat electron.log

      # Registering a login item is the one thing that cannot be proved off the
      # real OS: it writes to SMAppService on macOS and to the registry on
      # Windows, and a unit test can only check which options were passed. The
      # app from the previous step is still running, so drive it through its own
      # API and then ask the operating system whether it agrees.
      - name: Start-at-login registers with the OS and unregisters again
        shell: bash
        run: |
          PORT=$(grep -oE '127\.0\.0\.1:[0-9]+' electron.log | head -1 | cut -d: -f2)
          [ -n "$PORT" ] || { echo "no port in electron.log"; exit 1; }
          api() { curl -s --max-time 10 "http://127.0.0.1:$PORT/api/settings" "$@"; }
          set_login() { api -X POST -H 'Content-Type: application/json' -d "{\"launch_at_login\":$1}"; }
          RUN_KEY='HKCU\Software\Microsoft\Windows\CurrentVersion\Run'

          echo "--- it must report itself supported here ---"
          BEFORE=$(api)
          echo "$BEFORE"
          echo "$BEFORE" | grep -q '"supported":true' \
            || { echo "start at login reported UNSUPPORTED on $RUNNER_OS"; exit 1; }

          echo "--- turn it on ---"
          set_login true | tee on.json
          grep -q '"enabled":true' on.json || { echo "the OS did not take the login item"; exit 1; }
          if [ "$RUNNER_OS" = "Windows" ]; then
            reg query "$RUN_KEY" //s | grep -i "opened-at-login" \
              || { echo "nothing was written to the Run key"; reg query "$RUN_KEY"; exit 1; }
            echo "  registry entry present"
          fi

          echo "--- and off again, so the runner is left as it was found ---"
          set_login false | tee off.json
          grep -q '"enabled":false' off.json || { echo "the login item survived being turned off"; exit 1; }
          if [ "$RUNNER_OS" = "Windows" ]; then
            if reg query "$RUN_KEY" //s 2>/dev/null | grep -qi "opened-at-login"; then
              echo "the Run key entry was NOT removed"; reg query "$RUN_KEY"; exit 1; fi
            echo "  registry entry removed"
          fi
          echo "start at login round-tripped through the real OS"

      # The failures that actually reached users were renderer-side: a handler
      # bound to an element that did not exist, window.prompt throwing, a css
      # rule that could never hide a block. Load the real UI and check it.
      - name: UI loads and works
        run: npm run smoke:renderer

      - name: Tray popup renderer works
        run: npm run smoke:tray-popup

      # The smoke test proves the page loads and wires up. This proves it
      # renders the right thing: the picker, group notes, the fill spinner and
      # the guards. It runs on injected device data, so it needs no speakers.
      - name: UI behaves correctly
        shell: bash
        run: npx electron test/ui.js

      # The steps above run the source tree, where every file exists by
      # definition. A file missing from the BUILD only shows up in the packaged
      # app - which is how a "cannot find module castqueue.js" crash reached a
      # tester. Build it and run the real artifact.
      - name: Packaged app starts
        shell: bash
        run: |
          pkill -f "electron" 2>/dev/null || taskkill //IM electron.exe //F 2>/dev/null || true
          sleep 2
          npx electron-builder --dir --publish never 2>&1 | tail -3
          if [ "$RUNNER_OS" = "Windows" ]; then
            # only the top level of win-unpacked: deeper matches hit the bundled
            # yt-dlp.exe, which starts happily and proves nothing
            BIN=$(find dist/win-unpacked -maxdepth 1 -name '*.exe' | head -1)
          else
            BIN=$(find dist -path '*.app/Contents/MacOS/*' -type f -perm -u+x | head -1)
          fi
          echo "packaged binary: $BIN"
          [ -n "$BIN" ] || { echo "NO PACKAGED BINARY FOUND"; ls -R dist | head -30; exit 1; }
          case "$BIN" in
            *yt-dlp*|*resources*) echo "picked the wrong binary: $BIN"; exit 1 ;;
          esac
          "$BIN" > packaged.log 2>&1 &
          for i in $(seq 1 45); do
            PORT=$(grep -oE '127\.0\.0\.1:[0-9]+' packaged.log 2>/dev/null | head -1 | cut -d: -f2 || true)
            if [ -n "$PORT" ] && curl -sf --max-time 3 "http://127.0.0.1:$PORT/" >/dev/null; then
              echo "PACKAGED app served its UI on port $PORT after ${i}s"; break; fi
            sleep 1
            if [ "$i" = "45" ]; then
              echo "PACKAGED APP FAILED TO START - a file is probably missing from build.files"
              echo "--- packaged log ---"; cat packaged.log
              exit 1; fi
          done
          echo "--- packaged log ---"; cat packaged.log

      - name: No startup error was recorded
        shell: bash
        run: |
          F="$APPDATA/YouTube Audio Caster/startup-error.log"
          [ "$RUNNER_OS" = "macOS" ] && F="$HOME/Library/Application Support/YouTube Audio Caster/startup-error.log"
          if [ -f "$F" ]; then echo "STARTUP ERROR RECORDED:"; cat "$F"; exit 1; fi
          echo "no startup-error.log - clean start"
